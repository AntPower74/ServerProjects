<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#161b22">
    <title>ArrivaMove</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f0f0f2;
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .clock-container {
            text-align: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #clock-time {
            font-size: 2.5rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 0.2rem;
            letter-spacing: -1px;
        }
        #clock-date {
            color: #94a3b8;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            color: #f8fafc;
            margin-top: 0;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        select, input[type="date"] {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        select:focus, input[type="date"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
                .trip-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 1.2rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .trip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            background: rgba(30, 41, 59, 0.8);
        }
        .trip-times-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-width: 65px;
            border-right: 1px dashed rgba(255,255,255,0.1);
            padding-right: 1.5rem;
        }
        .time-block { text-align: center; }
        .time-val { display: block; font-size: 1.4rem; font-weight: 800; color: #f0f0f2; }
        .next-bus .time-val { color: #10b981; }
        .time-label { display: block; font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .time-duration { font-size: 0.85rem; color: #a855f7; font-weight: 600; display: flex; flex-direction: column; align-items: center; margin: 0.75rem 0; }
        .trip-info-col { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .trip-card.next-bus {
            border: 2px solid #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            background: rgba(16, 185, 129, 0.05);
            position: relative;
        }
        .next-bus-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .trip-time {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f0f0f2;
        }
        .next-bus .trip-time {
            color: #10b981;
        }
        .trip-stations {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            flex: 1;
        }
        .giorni-badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 5px;
            width: fit-content;
        }
        .note-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 5px;
            width: fit-content;
        }
        .trip-duration {
            color: #a855f7;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            flex: 0 0 80px;
        }
        .trip-duration small {
            display: block;
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 2px;
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #9e9ea6;
            font-size: 0.8rem;
        }
    
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #9e9ea6; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; font-family: inherit; font-size: 0.9rem; }
        .tab.active { background: #4ade80; color: #18181b; border-color: #4ade80; }
        .interchange-badge { background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 8px; font-weight:bold; }
        .interchange-details { font-size: 0.85rem; color: #a1a1aa; margin-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 8px; }

        .timeline { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); position: relative; padding-left: 10px; }
        .timeline::before { content: ''; position: absolute; left: 14px; top: 25px; bottom: 25px; width: 2px; background: rgba(255,255,255,0.1); }
        .timeline-step { position: relative; padding-left: 20px; margin-bottom: 12px; }
        .timeline-step:last-child { margin-bottom: 0; }
        .timeline-dot { position: absolute; left: 0; top: 4px; width: 10px; height: 10px; border-radius: 50%; z-index: 1; border: 2px solid #18181b; }
        .dot-start { background: #4ade80; }
        .dot-change { background: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
        .dot-end { background: #f87171; }
        .timeline-content { font-size: 0.85rem; color: #e4e4e7; line-height: 1.4; }
        .badge-linea { background: rgba(255,255,255,0.1); color: white; padding: 2px 5px; border-radius: 4px; font-size: 0.75rem; margin-left: 4px; border: 1px solid rgba(255,255,255,0.2); }
        
        @media (min-width: 600px) {
            body { padding: 2rem; }
            .container { padding: 2.5rem; }
        }
        
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @media (max-width: 600px) {
            body { padding: 0.3rem; }
            .container { padding: 0.8rem; }
            
            /* Data e ora in testa */
            .clock-container { padding: 0.5rem; margin-bottom: 0.8rem; }
            #clock-time { font-size: 1.6rem; margin-bottom: 0; }
            #clock-date { font-size: 0.75rem; }
            
            h1 { font-size: 1.2rem; margin-bottom: 0.8rem; }
            
            /* Due tasti di ricerca */
            .tabs { gap: 6px; margin-bottom: 10px; }
            .tab { padding: 6px 4px; font-size: 0.8rem; }
            
            /* Tendine a discesa */
            .form-group { gap: 0.6rem; margin-bottom: 1rem; }
            select, input[type="date"], input[type="text"] { 
                padding: 0.5rem 0.8rem; 
                font-size: 0.9rem;
            }
            
            .mobile-compact-select, .mobile-compact-select option {
                font-size: 0.8rem !important;
            }
        }
</style>
</head>
<body>

<div class="container">
    <div class="clock-container">
        <div id="clock-time">--:--:--</div>
        <div id="clock-date">Caricamento data...</div>
    </div>

    <a href="/orari/turni.html" style="display:block; text-align:center; color:#38bdf8; font-size:0.8rem; text-decoration:none; margin-bottom:0.8rem;">🔍 Cerca Corsa → Turno &amp; Deposito</a>
    <h1>Trova Corsa (Da - A)</h1>
    
    
    <div class="tabs">
        <button id="tab-linea" class="tab active" onclick="setMode('linea')">Ricerca per Linea</button>
        <button id="tab-globale" class="tab" onclick="setMode('globale')">Ricerca Globale (Cambi)</button>
    </div>
    <div class="form-group">
        <div id="lineaContainer">
            <label style="color:#9e9ea6; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Linea:</label>
            <select id="lineaSelect" onchange="updateStops()" class="mobile-compact-select">
                <option value="265">265 (Torino - Chivasso - Ivrea - Pont)</option>
                <option value="267">267 (Torino - Vinovo - Carignano)</option>
                <option value="268">268 (Torino - Aeroporto)</option>
                <option value="274">274 (Susa - Avigliana - Torino)</option>
                <option value="275/282">275/282 (Sestriere - Torino)</option>
                <option value="278">278 (Pinerolo - Vigone - Pancalieri)</option>
                <option value="283">283 (Cantalupa - Pinerolo)</option>
                <option value="285">285 (Oulx - Sestriere - Pinerolo)</option>
                <option value="303">303 (Prali - Perosa - Pinerolo - Torino)</option>
                <option value="901">901 (Bobbio - T. Pellice - Pinerolo - Torino)</option>
                <option value="MALPENSA">Malpensa (Torino - Chivasso - Carisio - Aeroporto)</option>
            </select>
        </div>
        <div>
            <label style="color:#9e9ea6; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Data di viaggio:</label>
            <input type="date" id="dateSelect" onchange="searchTrips()">
        </div>
        <div>
            <label style="color:#9e9ea6; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Partenza da:</label>
            <input type="search" id="fromSelect" list="fromDatalist" placeholder="Scrivi per cercare..." onclick="this.select()" oninput="searchTrips()" style="width: 100%; padding: 0.8rem; background: #21262d; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 1rem; box-sizing: border-box; -webkit-appearance: searchfield;">
            <datalist id="fromDatalist"></datalist>
        </div>
        <div>
            <label style="color:#9e9ea6; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Arrivo a:</label>
            <input type="search" id="toSelect" list="toDatalist" placeholder="Scrivi per cercare..." onclick="this.select()" oninput="searchTrips()" style="width: 100%; padding: 0.8rem; background: #21262d; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 1rem; box-sizing: border-box; -webkit-appearance: searchfield;">
            <datalist id="toDatalist"></datalist>
        </div>
    </div>
    
    <div id="results"></div>
</div>
<div class="footer">
    Dati estratti automaticamente dal PDF ufficiale Arriva<br><br>
    Ultimo aggiornamento: 17:02 del 19/07/2026<br>
    Developed by <span style="color: #f8fafc; font-weight: 600;">Antpower74</span>
</div>
<script>
    let tripsData = [];

    // Set default date to today
    document.getElementById('dateSelect').valueAsDate = new Date();

    let searchMode = 'linea';
    function setMode(mode) {
        searchMode = mode;
        document.getElementById('tab-linea').className = mode === 'linea' ? 'tab active' : 'tab';
        document.getElementById('tab-globale').className = mode === 'globale' ? 'tab active' : 'tab';
        document.getElementById('lineaContainer').style.display = mode === 'linea' ? 'block' : 'none';
        updateStops();
        if(typeof saveSearchState === 'function') saveSearchState();
    }

    function updateStops() {
        const linea = document.getElementById('lineaSelect').value;
        const allStops = new Set();
        
        tripsData.forEach(t => {
            if (searchMode === 'globale' || t._linea === linea) {
                Object.keys(t).forEach(k => {
                    if(!k.startsWith('_')) allStops.add(k);
                });
            }
        });
        
        const sortedStops = Array.from(allStops).sort();
        
        const fromDatalist = document.getElementById('fromDatalist');
        const toDatalist = document.getElementById('toDatalist');
        
        fromDatalist.innerHTML = '';
        toDatalist.innerHTML = '';
        
        sortedStops.forEach(stop => {
            fromDatalist.innerHTML += `<option value="${stop}">`;
            toDatalist.innerHTML += `<option value="${stop}">`;
        });
        
        if (searchMode === 'linea') searchTrips(); else document.getElementById('results').innerHTML = '';
    }

    function saveSearchState() {
        localStorage.setItem('arrivaMode', searchMode);
        localStorage.setItem('arrivaLinea', document.getElementById('lineaSelect').value);
    }

    window.onload = function() {
        const loadingDiv = document.createElement('div');
        loadingDiv.style = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(15,23,42,0.95); color:white; padding:20px; border-radius:10px; z-index:9999; font-weight:bold; border:1px solid #38bdf8; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.5);";
        loadingDiv.id = "loading-indicator";
        loadingDiv.innerHTML = "Sincronizzazione orari in corso...<br><br><i class='fa-solid fa-spinner fa-spin fa-2x'></i>";
        document.body.appendChild(loadingDiv);

        fetch('https://docs.google.com/spreadsheets/d/1_rr-cS7aGzF5svFS-9mKyq3KnKUbXlkKbGFRwsxd7lI/export?format=csv&t=' + Date.now())
        .then(r => r.text())
        .then(csv => {
            let lines = csv.split(/\r?\n/);
            function parseRow(str) {
                let result = [];
                let inQuotes = false;
                let current = '';
                for(let i=0; i<str.length; i++) {
                    let char = str[i];
                    if (char === '"' && str[i+1] === '"') { current += '"'; i++; }
                    else if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
                    else { current += char; }
                }
                result.push(current);
                return result;
            }

            let currentTrips = [];
            for (let i=0; i<lines.length; i++) {
                let row = parseRow(lines[i]);
                if (row.length === 0 || row[0] === '') continue;
                let firstCell = row[0];
                
                if (firstCell === 'Linea') {
                    currentTrips = [];
                    for(let c=1; c<row.length; c++) {
                        if (row[c]) {
                            let t = { _linea: row[c] };
                            currentTrips.push(t);
                            tripsData.push(t);
                        } else {
                            currentTrips.push(null);
                        }
                    }
                } else if (firstCell === 'Giorni') {
                    for(let c=1; c<row.length; c++) {
                        if (currentTrips[c-1] && row[c]) currentTrips[c-1]._giorni = row[c];
                    }
                } else if (firstCell === 'Stagionalita') {
                    for(let c=1; c<row.length; c++) {
                        if (currentTrips[c-1] && row[c]) currentTrips[c-1]._stagionalita = row[c];
                    }
                } else if (firstCell === 'Note') {
                    for(let c=1; c<row.length; c++) {
                        if (currentTrips[c-1] && row[c]) currentTrips[c-1]._note = row[c];
                    }
                } else if (firstCell === 'ID_Corsa') {
                    // skip
                } else {
                    let stopName = firstCell;
                    for(let c=1; c<row.length; c++) {
                        if (currentTrips[c-1] && row[c]) {
                            currentTrips[c-1][stopName] = row[c];
                        }
                    }
                }
            }
            
            document.getElementById('loading-indicator').remove();
            initApp();
        })
        .catch(e => {
            document.getElementById('loading-indicator').innerHTML = "Errore di connessione.<br>Ricarica la pagina.";
            console.error(e);
        });
    };

    function initApp() {
        if(localStorage.getItem('arrivaMode')) {
            searchMode = localStorage.getItem('arrivaMode');
            document.getElementById('tab-linea').className = searchMode === 'linea' ? 'tab active' : 'tab';
            document.getElementById('tab-globale').className = searchMode === 'globale' ? 'tab active' : 'tab';
            document.getElementById('lineaContainer').style.display = searchMode === 'linea' ? 'block' : 'none';
        }
        if(localStorage.getItem('arrivaLinea')) {
            document.getElementById('lineaSelect').value = localStorage.getItem('arrivaLinea');
        }
        
        document.getElementById('fromSelect').value = '';
        document.getElementById('toSelect').value = '';
        
        updateStops();
        
        document.getElementById('lineaSelect').addEventListener('change', saveSearchState);

        updateClock();
        setInterval(updateClock, 1000);
        setInterval(() => searchTrips(true), 60000);
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock-time').textContent = now.toLocaleTimeString('it-IT', { hour12: false });
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let dateStr = now.toLocaleDateString('it-IT', options);
        document.getElementById('clock-date').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    }

    function parseTime(tStr) {
        if (!tStr || tStr === 'D' || tStr === 'I' || tStr === 'R') return 0;
        let parts = tStr.split(/[:.]/);
        if (parts.length < 2) return 0;
        let h = parseInt(parts[0], 10);
        let m = parseInt(parts[1], 10);
        if (isNaN(h) || isNaN(m)) return 0;
        return h * 60 + m;
    }

    window.calendarioData = {};
    fetch('https://docs.google.com/spreadsheets/d/1_rr-cS7aGzF5svFS-9mKyq3KnKUbXlkKbGFRwsxd7lI/export?format=csv&gid=621598034&t=' + Date.now())
    .then(r => r.text())
    .then(csv => {
        let lines = csv.split(/\r?\n/);
        for(let i=1; i<lines.length; i++) {
            let cols = lines[i].split(',');
            if(cols.length >= 3) {
                let dateStr = cols[0].trim();
                let parts = dateStr.split('/');
                if (parts.length === 3) {
                    let formattedDate = `${parts[0]}-${parts[1]}-${parts[2]}`;
                    window.calendarioData[formattedDate] = cols[2].trim();
                }
            }
        }
        if (typeof searchTrips === 'function') searchTrips();
    })
    .catch(e => console.log('cal err', e));

    function mapGiorni(giorniStr) {
        if (!giorniStr) return "";
        if (giorniStr === 'GG') return "Giornaliero";
        if (giorniStr === '12345') return "Lun-Ven";
        if (giorniStr === '123456') return "Lun-Sab";
        if (giorniStr === '6') return "Sabato";
        if (giorniStr === '78' || giorniStr === '8') return "Dom / Festivi";
        return giorniStr;
    }

    function isCorsaValida(trip, targetDate) {
        const dayOfWeek = targetDate.getDay(); 
        const year = targetDate.getFullYear();
        const dateStr = `${('0' + targetDate.getDate()).slice(-2)}-${('0' + (targetDate.getMonth()+1)).slice(-2)}-${year}`;
        
        let tipoGiorno = window.calendarioData[dateStr];
        if (!tipoGiorno) {
            let month = targetDate.getMonth() + 1;
            if (month === 7 || month === 8) {
                tipoGiorno = dayOfWeek === 0 ? 'Festivo' : 'Vacanza (Estiva)';
            } else {
                tipoGiorno = dayOfWeek === 0 ? 'Festivo' : 'Scolastico';
            }
        }
        
        const isHoliday = (tipoGiorno === 'Festivo');
        const isScolastico = (tipoGiorno === 'Scolastico');
        
        const note = trip['_note'] || '';
        const stagionalita = trip['_stagionalita'] || '';
        const giorni = trip['_giorni'] || '';
        
        const isAugustBreak = (targetDate.getMonth() === 7 && targetDate.getDate() >= 4 && targetDate.getDate() <= 31);
        if (note.includes('04/08') && !isAugustBreak) return false;
        
        if ((stagionalita === 'SCO' || stagionalita === 'SCOL' || note.includes('Scol')) && !isScolastico) return false;
        if ((stagionalita === 'NS' || stagionalita === 'NSCOL' || note.includes('NScol') || note.includes('N.S.')) && isScolastico) return false;
        
        if (note.includes('A') && isAugustBreak) return false; 
        if (note.includes('F') && !isAugustBreak) return false;
        if (note.includes('J') && dateStr.startsWith('25-12')) return false;
        if (stagionalita === 'FEST' && !isHoliday) return false;
        if (stagionalita === 'FER' && isHoliday) return false;
        
        if (giorni) {
            if (giorni === 'GG') {
            } else if (giorni.match(/^[1-8]+$/)) {
                const weekStr = dayOfWeek === 0 ? '7' : dayOfWeek.toString();
                let isValidDay = false;
                
                if (giorni.includes(weekStr)) {
                    isValidDay = true;
                    if (isHoliday && !giorni.includes('8') && stagionalita !== 'FEST') {
                        isValidDay = false;
                    }
                }
                
                if (isHoliday && giorni.includes('8')) {
                    isValidDay = true;
                }
                
                if (!isValidDay) return false;
            }
        }
        
        return true;
    }

    function formatMinutes(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    function formatTime(mins) {
        let h = Math.floor(mins / 60);
        const m = mins % 60;
        if (h >= 24) h -= 24;
        return `${h}:${m.toString().padStart(2, '0')}`;
    }

    function searchTrips(isAutoUpdate = false) {
        if (searchMode === 'globale') {
            searchGlobalTrips(isAutoUpdate);
            return;
        }
        
        const fromStop = document.getElementById('fromSelect').value;

                        let mins = parseTime(trip[k]);

                    }
                });
                
                validStops.sort((a,b) => {
                    let ta = a.time, tb = b.time;
                    if (ta < 4*60 && tb > 20*60) ta += 24*60;
                    if (tb < 4*60 && ta > 20*60) tb += 24*60;
                    return ta - tb;
                });
                
                if (validStops.length >= 2) {
                    let first = validStops[0];
                    let last = validStops[validStops.length - 1];
                    let time1 = first.time;
                    let time2 = last.time;
                    if (time2 < time1 && time1 > 20*60 && time2 < 4*60) time2 += 24*60;
                    
                    displayTrips.push({
                        trip: trip,
                        time1: time1,
                        time2: time2,

                        toName: last.stop,

                    });
                }
            });

            const uniqueTrips = [];
            const seen = new Set();
            displayTrips.forEach(t => {
                const key = t.time1 + '-' + t.time2 + '-' + t.fromName;

                    seen.add(key);
                    uniqueTrips.push(t);
                }

                let endIndex = Math.min(displayTrips.length, startIndex + 10);
                if (endIndex - startIndex < 10) startIndex = Math.max(0, endIndex - 10);

            return;
        }

        const selectedLinea = document.getElementById('lineaSelect').value;
        
        let validTrips = [];
        tripsData.forEach(trip => {
            if (trip._linea === selectedLinea && trip[fromStop] && trip[toStop]) {
                if (!isCorsaValida(trip, targetDate)) return;

                let time1 = parseTime(trip[fromStop]);
                let time2 = parseTime(trip[toStop]);
                
                if (time1 > 0 && time2 > 0) {
                    if (time2 < time1 && time1 > 20*60 && time2 < 4*60) time2 += 24*60;

                            trip: trip,

<script>
window.turniData = [];
fetch('https://docs.google.com/spreadsheets/d/1SL7B9wTh8C0GRBirvmxsGvSQMb2VYR6l8Pw69DY_-wI/export?format=csv&t=' + Date.now())
.then(r => r.text())
.then(csv => {
    let lines = csv.split(/\r?\n/);
    function parseRow(str) {
        let result = [];
        let inQuotes = false;
        let current = '';
        for(let i=0; i<str.length; i++) {
            let char = str[i];
            if (char === '"' && str[i+1] === '"') { current += '"'; i++; }
            else if (char === '"') { inQuotes = !inQuotes; }
            else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
            else { current += char; }
        }
        result.push(current);
        return result;
    }

    let turniMap = {};
    for (let i=1; i<lines.length; i++) {
        let row = parseRow(lines[i]);
        if (row.length < 6 || !row[0]) continue;
        
        let codice = row[0];
        if (!turniMap[codice]) {
            turniMap[codice] = {
                codice: codice,
                nome: row[1],
                deposito: row[2],
                giorno: row[3],
                ora_inizio: row[4],
                ora_fine: row[5],
                corse: []
            };
        }
        
        if (row[6] || row[7] || row[9]) {
            turniMap[codice].corse.push({
                linea: row[6] || '',
                da: row[7] || '',
                a: row[8] || '',
                partenza: row[9] || '',
                arrivo: row[10] || ''
            });
        }
    }
    
    window.turniData = Object.values(turniMap);
})
.catch(e => console.log('turni err', e));

function findTurno(trip, dateVal) {
    if (!window.turniData || window.turniData.length === 0) return null;
    const d = new Date(dateVal);
    const daysArray = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
    const currentDayName = daysArray[d.getDay()];
    const dayType = d.getDay() === 0 ? 'Domenica' : (d.getDay() === 6 ? 'Sabato' : 'Feriale');
    
    const lineaRaw = String(trip['_linea'] || '');
    const match = lineaRaw.match(/\d+/);
    const num = match ? match[0] : '';
    const lineaPad = num.padStart(6, '0');
    let stopNames = Object.keys(trip).filter(k => !k.startsWith('_') && trip[k]);
    stopNames.sort((a, b) => {
        let ta = parseTime(trip[a]), tb = parseTime(trip[b]);
        if (ta < 4*60 && tb > 20*60) ta += 24*60;
        if (tb < 4*60 && ta > 20*60) tb += 24*60;
        return ta - tb;
    });
    
    let stops = [];
    stopNames.forEach(k => {
        let t = trip[k].split(/[:.]/);
        if (t.length >= 2) {
            let mins = parseInt(t[0])*60 + parseInt(t[1]);
            stops.push({ time: mins, name: k });
        }
    });
    if (stops.length === 0) return null;
    
    stops.sort((ta, tb) => {
        let a = ta.time, b = tb.time;
        if (a < 4*60 && b > 20*60) a += 24*60;
        if (b < 4*60 && a > 20*60) b += 24*60;
        return a - b;
    });
    
    let fMins = stops[0].time;
    if (fMins >= 24*60) fMins -= 24*60;
    
    const fNameMatch = stops[0].name.match(/[a-zA-Z]+/);
    let fWord = fNameMatch ? fNameMatch[0].toLowerCase() : '';
    
    // Add specific aliases to ensure better fallback matching
    const fNameLower = stops[0].name.toLowerCase();
    if (fNameLower.includes('porta susa') || fNameLower.includes('autostazione') || fNameLower.includes('bolzano')) {
        fWord = 'autostazione';
    } else if (fWord === 'torino') {
        fWord = 'torino';
    }
    
    const tToM = t => {
        if (!t) return -1;
        let p = t.split(':');
        if (p.length < 2) return -1;
        return parseInt(p[0])*60 + parseInt(p[1]);
    };
    
    let bestMatch = null;
    let minDiff = 999;
    let bestScore = -1;
    
    for (let turno of window.turniData) {
        let isRightDay = false;
        const tGiorno = turno.giorno.toLowerCase();
        
        if (tGiorno === currentDayName.toLowerCase()) {
            isRightDay = true;
        } else if (dayType === 'Feriale' && (tGiorno.includes('feriale') || tGiorno.includes('lun-ven') || tGiorno.includes('lun ven'))) {
            isRightDay = true;
        } else if (dayType === 'Sabato' && tGiorno.includes('sabato')) {
            isRightDay = true;
        } else if (dayType === 'Domenica' && (tGiorno.includes('domenica') || tGiorno.includes('festivo'))) {
            isRightDay = true;
        }
        
        if (!isRightDay) continue;
        
        for (let c of turno.corse) {
            let pMins = tToM(c.partenza);
            if (pMins >= 24*60) pMins -= 24*60;
            
            let diff = Math.abs(pMins - fMins);
            if (diff <= 2) { // Exact time matching with strict 2-minute tolerance
                let isLineaMatch = (c.linea === lineaPad || c.linea === num || c.linea === lineaRaw);
                let isLocMatch = (fWord && c.da && c.da.toLowerCase().includes(fWord));
                
                let score = 0;
                if (isLineaMatch && isLocMatch) score = 3;
                else if (isLineaMatch) score = 2;
                else if (isLocMatch) score = 1;
                
                if (score > 0) {
                    if (score > bestScore || (score === bestScore && diff < minDiff)) {
                        bestScore = score;
                        minDiff = diff;
                        bestMatch = turno;
                    }
                }
            }
        }
    }
    return bestMatch;
}

function showTripDetails(index) {
    if (!window.currentRenderedResults || !window.currentRenderedResults[index]) return;
    const r = window.currentRenderedResults[index];
    const content = document.getElementById('tripModalContent');
    const dateVal = document.getElementById('dateSelect').value;
    let html = '';
    
    function renderStops(trip) {
        let stops = [];
        Object.keys(trip).forEach(k => {
            if (!k.startsWith('_')) {
                let mins = parseTime(trip[k]);
                if (mins > 0) stops.push({name: k, time: mins, originalTime: trip[k]});
            }
        });
        stops.sort((a,b) => {
            let ta = a.time, tb = b.time;
            if (ta < 4*60 && tb > 20*60) ta += 24*60;
            if (tb < 4*60 && ta > 20*60) tb += 24*60;
            return ta - tb;
        });
        
        const now = new Date();
        const currentMins = now.getHours() * 60 + now.getMinutes();
        
        let isEnRoute = false;
        let nextStopIndex = -1;
        
        if (stops.length > 0) {
            let start = stops[0].time;
            let end = stops[stops.length-1].time;
            if (currentMins >= start && currentMins <= end) {
                isEnRoute = true;
                for (let i = 0; i < stops.length; i++) {
                    if (stops[i].time >= currentMins) {
                        nextStopIndex = i;
                        break;
                    }
                }
            }
        }
        
        let stopsHtml = '<div style="position:relative; padding-left:15px; margin-bottom:10px;">';
        stopsHtml += '<div style="position:absolute; left:4px; top:10px; bottom:10px; width:2px; background:rgba(255,255,255,0.1);"></div>';
        
        if (isEnRoute) {
            stopsHtml += `<div style="background:rgba(59,130,246,0.15); border-radius:6px; padding:10px; margin-bottom:15px; text-align:center; color:#60a5fa; font-weight:bold; font-size:0.9rem; border:1px solid rgba(59,130,246,0.3);"><i class="fa-solid fa-satellite-dish" style="animation: pulse 2s infinite;"></i> BUS IN VIAGGIO</div>`;
        }
        
        stops.forEach((s, idx) => {
            let color = '#94a3b8';
            let fw = 'normal';
            let opacity = '1';
            let extraInfo = '';
            
            if (isEnRoute) {
                if (idx < nextStopIndex) {
                    color = '#4ade80'; // passed
                    opacity = '0.5';
                    extraInfo = '<i class="fa-solid fa-check" style="color:#4ade80; font-size:0.8rem; margin-left:5px;"></i>';
                } else if (idx === nextStopIndex) {
                    color = '#3b82f6'; // next
                    fw = 'bold';
                    let diff = s.time - currentMins;
                    extraInfo = `<div style="color:#60a5fa; font-size:0.8rem; margin-top:2px;"><i class="fa-solid fa-bus"></i> Prossima fermata (tra ${diff} min)</div>`;
                }
            } else {
                if (idx === 0) { color = '#4ade80'; fw = 'bold'; }
                if (idx === stops.length - 1) { color = '#f87171'; fw = 'bold'; }
            }
            
            let dotStyle = `position:absolute; left:-15px; top:4px; width:10px; height:10px; border-radius:50%; background:${color}; border:2px solid var(--bg-card);`;
            if (isEnRoute && idx === nextStopIndex) {
                dotStyle += ` box-shadow: 0 0 8px 2px rgba(59,130,246,0.8);`;
            }
            
            stopsHtml += `<div style="position:relative; padding-bottom:15px; opacity:${opacity};">
                <div style="${dotStyle}"></div>
                <div style="display:flex; flex-direction:column; justify-content:center; font-size:0.9rem; color:var(--text-light); font-weight:${fw}; line-height:1.2;">
                    <div style="display:flex; justify-content:space-between; width:100%;">
                        <span style="flex:1; padding-right:15px;">${s.name}</span>
                        <span style="color:${color}; white-space:nowrap;">${s.originalTime}</span>
                    </div>
                    ${extraInfo}
                </div>
            </div>`;
        });
        stopsHtml += '</div>';
        
        window.currentModalStops = stops;
        return stopsHtml;
    }
    
    if (r.type === 'interchange') {
        const turno1 = findTurno(r.trip1, dateVal);
        const turno2 = findTurno(r.trip2, dateVal);
        
        let turno1Html = turno1 ? `<span style="background:#2563eb; color:white; padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:bold; margin-left:10px; vertical-align:middle;">${turno1.codice.toUpperCase()}</span>` : '';
        let turno2Html = turno2 ? `<span style="background:#2563eb; color:white; padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:bold; margin-left:10px; vertical-align:middle;">${turno2.codice.toUpperCase()}</span>` : '';

        html += `<h4 style="color:#3b82f6; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px; display:flex; align-items:center;">Linea ${r.trip1['_linea']} ${turno1Html}</h4>`;
        html += renderStops(r.trip1);
        
        let waitTimeHtml = '';
        if (r.t2Dep && r.t1Arrival) {
            let w = r.t2Dep - r.t1Arrival;
            let wh = Math.floor(w/60);
            let wm = w%60;
            waitTimeHtml = wh > 0 ? `${wh}h ${wm}m` : `${wm}m`;
        }
        
        html += `<div style="background:rgba(59,130,246,0.15); border-left:4px solid #3b82f6; padding:12px; margin:20px 0; border-radius:6px; font-size:0.9rem; color:#bfdbfe;">
            <b style="color:#60a5fa;">&#8644; Cambio a:</b> ${r.interchangeStop}<br>
            <span style="margin-top:5px; display:inline-block;">&#9202; Tempo di attesa: <b>${waitTimeHtml}</b></span>
        </div>`;
        html += `<h4 style="color:#3b82f6; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px; display:flex; align-items:center;">Linea ${r.trip2['_linea']} ${turno2Html}</h4>`;
        html += renderStops(r.trip2);
        
    } else {
        const tripObj = r.trip ? r.trip : r;
        const lineaInfo = tripObj['_linea'] || 'Sconosciuta';
        const turnoInfo = findTurno(tripObj, dateVal);
        let turnoHtml = '';
        if (turnoInfo) {
            turnoHtml = `<span style="background:#2563eb; color:white; padding:4px 8px; border-radius:4px; font-size:0.8rem; font-weight:bold; margin-left:10px;">${turnoInfo.codice.toUpperCase()}</span>`;
        }

        html += `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; margin-bottom:15px;">
                    <h4 style="color:var(--accent-cyan); margin:0; display:flex; align-items:center;">Linea ${lineaInfo} ${turnoHtml}</h4>
                    <button onclick="startDriverGps()" style="background:#2563eb; color:white; border:none; padding:8px 12px; border-radius:6px; font-size:0.85rem; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-location-crosshairs"></i> Attiva GPS</button>
                 </div>
                 <div id="gpsStatus" style="background:#1e293b; padding:10px; border-radius:6px; font-size:0.9rem; color:#cbd5e1; margin-bottom:15px; display:none;"></div>`;
        html += renderStops(tripObj);
    }
    
    content.innerHTML = html;
    const modal = document.getElementById('tripModal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

let gpsWatchId = null;

function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI/180;
    const p2 = lat2 * Math.PI/180;
    const dp = (lat2-lat1) * Math.PI/180;
    const dl = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(dp/2) * Math.sin(dp/2) +
              Math.cos(p1) * Math.cos(p2) *
              Math.sin(dl/2) * Math.sin(dl/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function startDriverGps() {
    if (!navigator.geolocation) {
        alert("GPS non supportato su questo dispositivo.");
        return;
    }
    
    const statusDiv = document.getElementById('gpsStatus');
    statusDiv.style.display = 'block';
    statusDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connessione satellitare in corso...';
    
    if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
    
    gpsWatchId = navigator.geolocation.watchPosition(
        (position) => {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            
            if (!window.currentModalStops) return;
            
            let closestStop = null;
            let minDistance = Infinity;
            
            window.currentModalStops.forEach(stop => {
                if (window.stopsCoords && window.stopsCoords[stop.name]) {
                    const stopLat = window.stopsCoords[stop.name].lat;
                    const stopLng = window.stopsCoords[stop.name].lng;
                    const dist = haversineDistance(userLat, userLng, stopLat, stopLng);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestStop = stop;
                    }
                }
            });
            
            if (closestStop) {
                const now = new Date();
                const currentMins = now.getHours() * 60 + now.getMinutes();
                const diff = currentMins - closestStop.time;
                
                let distFormat = Math.round(minDistance) > 1000 ? (minDistance/1000).toFixed(1) + 'km' : Math.round(minDistance) + 'm';
                let statusMsg = `<div style="font-size:0.8rem; color:#94a3b8; margin-bottom:5px;">Rilevata fermata più vicina: <b style="color:white">${closestStop.name}</b> (a ${distFormat})</div>`;
                
                if (diff > 0) {
                    statusMsg += `<div style="color:#f87171; font-weight:bold; font-size:1.1rem; padding-top:5px; border-top:1px solid rgba(255,255,255,0.1);"><i class="fa-solid fa-clock"></i> Sei in RITARDO di ${diff} min</div>`;
                } else if (diff < 0) {
                    statusMsg += `<div style="color:#4ade80; font-weight:bold; font-size:1.1rem; padding-top:5px; border-top:1px solid rgba(255,255,255,0.1);"><i class="fa-solid fa-clock"></i> Sei in ANTICIPO di ${Math.abs(diff)} min</div>`;
                } else {
                    statusMsg += `<div style="color:#60a5fa; font-weight:bold; font-size:1.1rem; padding-top:5px; border-top:1px solid rgba(255,255,255,0.1);"><i class="fa-solid fa-clock"></i> Sei in PERFETTO ORARIO!</div>`;
                }
                statusDiv.innerHTML = statusMsg;
            } else {
                statusDiv.innerHTML = "Errore: Coordinate non mappate per questa tratta.";
            }
        },
        (error) => {
            statusDiv.innerHTML = "Errore GPS: Devi autorizzare la posizione nel browser.";
        },
        { enableHighAccuracy: true, maximumAge: 0 }
    );
}

function closeTripModal() {
    if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
    document.getElementById('tripModal').style.display = 'none';
    document.body.style.overflow = 'auto';
}



document.getElementById('tripModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeTripModal();
    }
});

        reg.onupdatefound = () => {

        }
      });
