<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corsa → Turno | ArrivaMove</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f0f0f2;
            margin: 0;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 1.2rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            color: #f8fafc;
            margin: 0 0 0.3rem 0;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 1.2rem;
        }
        .nav-link {
            display: block;
            text-align: center;
            color: #38bdf8;
            font-size: 0.8rem;
            text-decoration: none;
            margin-bottom: 1rem;
        }
        .nav-link:hover { text-decoration: underline; }

        label {
            display: block;
            color: #9e9ea6;
            font-size: 0.82rem;
            margin-bottom: 0.3rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
        }
        .form-full { margin-bottom: 0.6rem; }
        select, input[type="text"], input[type="time"] {
            width: 100%;
            padding: 0.5rem 0.7rem;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 0.9rem;
            font-family: inherit;
            appearance: none;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-search {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.8rem;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border: none;
            border-radius: 10px;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }
        .btn-search:hover { opacity: 0.9; }

        #results { margin-top: 1rem; }

        .result-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }
        .result-card.exact { border-color: #4ade80; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.6rem;
        }
        .turno-nome {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f8fafc;
        }
        .turno-code {
            font-size: 0.75rem;
            color: #94a3b8;
            font-family: monospace;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .badge-domenica { background: #7c3aed; color: white; }
        .badge-feriale  { background: #0284c7; color: white; }
        .badge-sabato   { background: #b45309; color: white; }

        .info-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 0.6rem;
        }
        .info-row span { display: flex; align-items: center; gap: 4px; }

        .corsa-match {
            background: rgba(74,222,128,0.08);
            border: 1px solid rgba(74,222,128,0.25);
            border-radius: 8px;
            padding: 0.5rem 0.7rem;
            font-size: 0.85rem;
        }
        .corsa-match .orario {
            font-weight: 700;
            color: #4ade80;
            font-size: 0.9rem;
        }
        .corsa-match .tratta {
            color: #e2e8f0;
        }
        .corsa-match .linea-badge {
            background: rgba(56,189,248,0.15);
            border: 1px solid rgba(56,189,248,0.3);
            color: #38bdf8;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            margin-right: 4px;
        }

        .empty { text-align: center; color: #64748b; padding: 2rem 0; font-size: 0.9rem; }
        .loading { text-align: center; color: #38bdf8; padding: 1rem 0; }

        .footer {
            text-align: center;
            color: #4a5568;
            font-size: 0.72rem;
            margin-top: 1.5rem;
            padding-bottom: 1rem;
        }

        @media (max-width: 400px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Corsa → Turno</h1>
    <p class="subtitle">Trova quale turno e deposito esegue una corsa</p>
    <a href="/orari/" class="nav-link">← Torna agli orari</a>

    <div class="form-row">
        <div>
            <label>Orario di Partenza</label>
            <input type="time" id="orarioInput" style="font-size:1.1rem; padding:0.6rem;">
        </div>
        <div>
            <label>Luogo Partenza (es: Caselle)</label>
            <input type="text" id="daInput" placeholder="Cerca località..." list="daDatalist" style="font-size:1.1rem; padding:0.6rem;">
            <datalist id="daDatalist"></datalist>
        </div>
    </div>
    <div class="form-row" style="margin-top:0.8rem; opacity:0.8;">
        <div>
            <label>Giorno (opzionale)</label>
            <select id="giornoSelect">
                <option value="">Tutti i giorni</option>
                <option value="Feriale (Lun-Ven)">Feriale (Lun-Ven)</option>
                <option value="Sabato">Sabato</option>
                <option value="Domenica">Domenica</option>
            </select>
        </div>
        <div>
            <label>Linea (opzionale)</label>
            <input type="text" id="lineaInput" placeholder="es: 268" list="lineaDatalist">
            <datalist id="lineaDatalist"></datalist>
        </div>
    </div>
    <button class="btn-search" onclick="cerca()">Cerca Turno</button>

    <div id="results"></div>
</div>

<div class="footer">
    Ultimo aggiornamento: 17:02 del 19/07/2026<br>
    Developed by <span style="color:#f8fafc; font-weight:600">Antpower74</span>
</div>

<script>
let turniData = [];

async function loadData() {
    document.getElementById('results').innerHTML = '<p class="loading">Caricamento dati...</p>';
    const resp = await fetch('turni_corse.json?v=1');
    turniData = await resp.json();
    
    // Pulizia e split intelligente delle corse
    turniData.forEach(turno => {
        turno.corse.forEach(c => {
            // Ricostruiamo la descrizione intera originale
            let desc_completa = c.da + (c.a ? " - " + c.a : "");
            
            // Rimuove eventuali numeri di nota corsa a fine descrizione (es: " 221")
            desc_completa = desc_completa.replace(/\s+\d+$/, '');
            
            // Split intelligente: cerca un trattino seguito da almeno 3 lettere maiuscole
            let parts = desc_completa.split(/\s+-\s+(?=[A-Z]{3,})/);
            if (parts.length === 1) {
                // Fallback: split normale al primo trattino
                let simpleParts = desc_completa.split(/\s+-\s+/);
                if (simpleParts.length > 1) {
                    parts = [simpleParts[0], simpleParts.slice(1).join(' - ')];
                }
            }
            
            c.partenza_pulita = parts[0] ? parts[0].trim() : desc_completa;
            c.arrivo_pulito = parts.length > 1 ? parts[1].trim() : '';
        });
    });

    document.getElementById('results').innerHTML = '';
    populateDatalist();
}

function populateDatalist() {
    const linee = new Set();
    const localita = new Set();
    
    turniData.forEach(turno => {
        turno.corse.forEach(c => {
            linee.add(c.linea);
            if (c.partenza_pulita) localita.add(c.partenza_pulita);
        });
    });

    const lineaList = document.getElementById('lineaDatalist');
    lineaList.innerHTML = '';
    [...linee].sort().forEach(l => {
        lineaList.innerHTML += `<option value="${l.replace(/^0+/, '')}">`;
    });

    const daList = document.getElementById('daDatalist');
    daList.innerHTML = '';
    [...localita].sort().forEach(s => {
        daList.innerHTML += `<option value="${s}">`;
    });
}

function normalizeLinea(input) {
    const n = input.trim().replace(/^0+/, '');
    return n.padStart(6, '0');
}

function timeToMins(t) {
    if (!t) return -1;
    const parts = t.split(':');
    return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function badgeGiorno(g) {
    const cls = g === 'Domenica' ? 'badge-domenica' : g === 'Feriale (Lun-Ven)' ? 'badge-feriale' : 'badge-sabato';
    return `<span class="badge ${cls}">${g}</span>`;
}

function matchPartenza(partenza, filtro) {
    let p = partenza.toLowerCase();
    let f = filtro.toLowerCase();
    
    // Alias Porta Susa / Autostazione
    if (f.includes('porta susa') || f.includes('autostazione')) {
        if (p.includes('porta susa') || p.includes('autostazione') || p.includes('c.so bolzano')) return true;
    }
    // Alias Pinerolo FS / Movicentro
    if (f.includes('pinerolo') && (f.includes('fs') || f.includes('movicentro'))) {
        if (p.includes('pinerolo') && (p.includes('fs') || p.includes('movicentro'))) return true;
    }
    // Alias Chivasso FS / Movicentro
    if (f.includes('chivasso') && (f.includes('fs') || f.includes('movicentro'))) {
        if (p.includes('chivasso') && (p.includes('fs') || p.includes('movicentro'))) return true;
    }
    
    return p.includes(f);
}

function cerca() {
    const giornoFiltro = document.getElementById('giornoSelect').value;
    const lineaRaw = document.getElementById('lineaInput').value.trim();
    const daFiltro = document.getElementById('daInput').value.trim().toLowerCase();
    const orarioFiltro = document.getElementById('orarioInput').value;

    if (!daFiltro && !orarioFiltro && !lineaRaw) {
        document.getElementById('results').innerHTML = '<p class="empty">Inserisci un Luogo di partenza, un Orario o una Linea.</p>';
        return;
    }

    const lineaFiltro = lineaRaw ? normalizeLinea(lineaRaw) : '';
    const orarioMins = orarioFiltro ? timeToMins(orarioFiltro) : -1;

    let corseTrovate = [];

    turniData.forEach(turno => {
        if (giornoFiltro && turno.giorno !== giornoFiltro) return;

        turno.corse.forEach(c => {
            if (lineaFiltro && c.linea !== lineaFiltro) return;
            if (daFiltro && !matchPartenza(c.partenza_pulita, daFiltro)) return;
            
            if (orarioMins >= 0) {
                const mins = timeToMins(c.partenza);
                if (Math.abs(mins - orarioMins) > 5) return; // ±5 min
            }

            corseTrovate.push({
                turno: turno,
                corsa: c,
                partenzaMins: timeToMins(c.partenza)
            });
        });
    });

    const container = document.getElementById('results');
    if (corseTrovate.length === 0) {
        container.innerHTML = '<p class="empty">Nessuna corsa trovata con questi criteri.</p>';
        return;
    }

    // Ordina le corse in ordine cronologico di partenza
    corseTrovate.sort((a, b) => a.partenzaMins - b.partenzaMins);

    container.innerHTML = `<p style="font-size:0.8rem; color:#64748b; margin-bottom:0.5rem;">Trovate ${corseTrovate.length} corse in partenza</p>`;

    corseTrovate.forEach(({ turno, corsa }) => {
        container.innerHTML += `
        <div class="result-card">
            <div class="card-header">
                <div>
                    <span class="orario" style="font-size:1.2rem; font-weight:800; color:#4ade80;">${corsa.partenza}</span>
                    ${corsa.arrivo ? `<span style="color:#94a3b8; font-size:0.85rem"> → arr. ${corsa.arrivo}</span>` : ''}
                </div>
                ${badgeGiorno(turno.giorno)}
            </div>
            
            <div style="margin-bottom:0.8rem;">
                <span class="linea-badge" style="background: rgba(56,189,248,0.15); color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-right: 6px;">Linea ${corsa.linea.replace(/^0+/, '')}</span>
                <span style="color:#f8fafc; font-weight:500; font-size:0.9rem;">${corsa.partenza_pulita} → ${corsa.arrivo_pulito}</span>
            </div>

            <div style="background:rgba(0,0,0,0.2); padding:0.6rem; border-radius:8px; border-left:3px solid #38bdf8;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:0.85rem; font-weight:700; color:#e2e8f0;">🚌 Turno: ${turno.nome} <span style="color:#94a3b8; font-weight:normal; font-size:0.75rem;">(${turno.codice})</span></div>
                    <div style="font-size:0.75rem; color:#94a3b8;">🏢 Dep: <strong style="color:#e2e8f0">${turno.deposito}</strong></div>
                </div>
            </div>
        </div>`;
    });
}

window.onload = loadData;
</script>
</body>
</html>
